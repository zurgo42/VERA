# ============================================================
# NOT-SCHALTER WARTUNGSMODUS (nginx-Variante von .htaccess)
#
# Einmalige Einrichtung (einmal noetig, danach NIE wieder):
#   1. Pfad in Zeile "set $wartung_root ..." unten an den
#      tatsaechlichen Installationsort anpassen (wo wartung.html auf
#      diesem Server liegt).
#   2. Diese Datei per "include" in den passenden server{}-Block der
#      nginx-Konfiguration einbinden, z. B.:
#        server {
#            ...
#            include /pfad/zu/nginx-wartungsmodus.conf;
#            ...
#        }
#   3. Konfiguration testen und laden:
#        nginx -t && systemctl reload nginx
#      (oder: service nginx reload / nginx -s reload, je nach System)
#
# Danach taeglicher Gebrauch - KEIN Reload mehr noetig:
#   Aktivieren:   leere Datei "WARTUNG_AN" im unten gesetzten
#                 $wartung_root-Verzeichnis anlegen
#                 (z. B. touch /pfad/zu/WARTUNG_AN)
#   Deaktivieren: diese Datei wieder loeschen
#                 (z. B. rm /pfad/zu/WARTUNG_AN)
#
# Wirkung: JEDE Anfrage an diesen Server-Block - unabhaengig vom
# aufgerufenen Skript (index.php, login.php, beamerbild.php,
# process_*.php, ...) - wird mit Status 503 beantwortet und zeigt die
# statische, komplett PHP-freie Seite wartung.html. Kein PHP-Code wird
# dafuer mehr ausgefuehrt. Die Datei-Existenzpruefung erfolgt bei jeder
# Anfrage neu, ein nginx-Reload ist fuer das Ein-/Ausschalten selbst
# nicht erforderlich.
#
# Technischer Hinweis: /wartung.html selbst ist von der Pruefung
# ausgenommen (zweites "if" unten) - sonst wuerde der interne Redirect
# von error_page auf /wartung.html erneut abgefangen und nginx zeigt
# nur seine generische Standard-503-Seite statt des eigentlichen
# Inhalts.
# ============================================================

set $wartung_root /pfad/zu/mv/neu;
set $wartung_aktiv 0;

if (-f $wartung_root/WARTUNG_AN) {
    set $wartung_aktiv 1;
}
if ($uri = /wartung.html) {
    set $wartung_aktiv 0;
}
if ($wartung_aktiv = 1) {
    return 503;
}

error_page 503 /wartung.html;
location = /wartung.html {
    root $wartung_root;
}
